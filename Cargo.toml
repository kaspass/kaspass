[package]
name = "membership-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
silverscript-lang = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1" }
silverscript-abi = { git = "https://github.com/kaspanet/silverscript", rev = "a0dd7448ccc7bad5b99140f2c8edbbd0b2a874f1" }
kaspa-consensus-core = "2.1.0"
kaspa-txscript = "2.1.0"
kaspa-txscript-errors = "2.1.0"
kaspa-addresses = "2.1.0"
kaspa-hashes = "2.1.0"
kaspa-rpc-core = "2.1.0"
kaspa-wrpc-client = "2.1.0"
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std", "serde"] }
blake2b_simd = "1.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faster-hex = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ammonia = "4"
